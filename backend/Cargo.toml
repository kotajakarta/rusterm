[package]
name = "xterm-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "xterm_backend"
path = "src/lib.rs"

[[bin]]
name = "rusterm"
path = "src/main.rs"

[[bin]]
name = "xterm-backend"
path = "src/main.rs"

[dependencies]
# Async runtime & Web
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography & Security
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }

# Database (Bundled SQLite for zero C dependency issues)
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# SSH Client
russh = "0.45"
russh-keys = "0.45"

# Utilities & System
rust-embed = "8.5"
mime_guess = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
async-trait = "0.1"
pbkdf2 = "0.13.0"
sha2 = "0.11.1"
hmac = "0.13.0"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3"

